<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘버블럭스 뱀게임 🔢</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:10px 8px 20px;
  background:radial-gradient(ellipse at 30% 20%,#1e0a44 0%,#0a1530 50%,#000a18 100%);
  font-family:"Arial Rounded MT Bold","Comic Sans MS",Arial,sans-serif;
  overflow-x:hidden;user-select:none;color:white;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#ffffc0 0%,transparent 100%),
    radial-gradient(1px   1px   at 34%  8%,white    0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 56% 14%,white   0%,transparent 100%),
    radial-gradient(1px   1px   at 73% 32%,#ffffc0 0%,transparent 100%),
    radial-gradient(1px   1px   at 89% 11%,white    0%,transparent 100%),
    radial-gradient(1px   1px   at  7% 63%,#ffffc0 0%,transparent 100%),
    radial-gradient(1px   1px   at 45% 74%,white    0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 79%,#ffffc0 0%,transparent 100%);
}
h1{font-size:clamp(1.2rem,5vw,1.9rem);color:#FFD700;text-shadow:0 0 18px #FFD70077;
   margin-bottom:7px;z-index:1;letter-spacing:1px;}
.topbar{display:flex;gap:10px;margin-bottom:7px;z-index:1;align-items:center;
        flex-wrap:wrap;justify-content:center;}
.pill{background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.18);
      border-radius:20px;padding:4px 14px;font-size:.9rem;font-weight:bold;}
.pill.gold{background:rgba(255,215,0,.14);border-color:#FFD700;color:#FFD700;}
#nblabel{z-index:1;font-size:.92rem;font-weight:bold;padding:4px 18px;border-radius:20px;
         border:2px solid #FF3333;color:#FF3333;background:rgba(255,51,51,.11);
         margin-bottom:8px;transition:color .3s,border-color .3s,background .3s;
         white-space:nowrap;}
.wrap{position:relative;border-radius:14px;overflow:hidden;
      border:4px solid #FFD700;box-shadow:0 0 38px #FFD70044,0 0 70px #7744FF1A;z-index:1;}
canvas{display:block;}
#pc{position:absolute;inset:0;pointer-events:none;}
#ov{position:absolute;inset:0;background:rgba(0,0,14,.84);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;
    border-radius:10px;}
#ov.hidden{display:none;}
.ov-icon{font-size:3.8rem;}
.ov-title{font-size:clamp(1.3rem,4vw,1.9rem);text-align:center;}
.ov-desc{font-size:.9rem;color:#bbb;text-align:center;padding:0 18px;line-height:1.65;}
.bigbtn{background:linear-gradient(135deg,#FFD700,#FF9900);color:#1a1000;border:none;
        border-radius:30px;padding:12px 40px;font-size:1.3rem;font-weight:bold;
        font-family:inherit;cursor:pointer;box-shadow:0 4px 18px #FFD70055;
        transition:transform .12s,box-shadow .12s;}
.bigbtn:hover{transform:scale(1.06);}
.bigbtn:active{transform:scale(.95);}
.btmrow{display:flex;gap:10px;margin-top:11px;z-index:1;flex-wrap:wrap;
        justify-content:center;align-items:center;}
.rbtn{background:rgba(255,80,80,.16);border:1.5px solid rgba(255,100,100,.35);
      color:#FF9999;border-radius:18px;padding:6px 16px;font-size:.88rem;
      font-family:inherit;cursor:pointer;transition:background .15s,transform .1s;}
.rbtn:hover{background:rgba(255,80,80,.28);}
.rbtn:active{transform:scale(.93);}
.spgrp{display:flex;gap:5px;align-items:center;}
.splbl{font-size:.82rem;color:#777;}
.spbtn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);
       color:#aaa;border-radius:15px;padding:5px 12px;font-size:.85rem;
       font-family:inherit;cursor:pointer;transition:all .14s;}
.spbtn.on{background:rgba(100,210,255,.2);border-color:#55BBFF;color:#88DDFF;}
.spbtn:active{transform:scale(.9);}
.dpad{display:grid;grid-template-areas:". U ." "L . R" ". D .";gap:7px;
      margin-top:9px;z-index:1;}
.dp{width:58px;height:58px;background:rgba(255,255,255,.09);
    border:2px solid rgba(255,255,255,.17);border-radius:13px;font-size:1.7rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .09s,transform .07s;touch-action:none;}
.dp:active{background:rgba(255,255,255,.23);transform:scale(.9);}
.hint{color:#444;font-size:.76rem;margin-top:5px;z-index:1;}
</style>
</head>
<body>

<h1>🔢 넘버블럭스 뱀게임 🐍</h1>

<div class="topbar">
  <div class="pill">점수 <span id="sv">0</span></div>
  <div class="pill gold">최고 <span id="bv">0</span></div>
</div>
<div id="nblabel">넘버블럭 1 (하나)이에요!</div>

<div class="wrap">
  <canvas id="gc"></canvas>
  <canvas id="pc"></canvas>
  <div id="ov">
    <div class="ov-icon" id="oi">🔢</div>
    <div class="ov-title" id="ot" style="color:#FFD700">넘버블럭스 뱀게임!</div>
    <div class="ov-desc"  id="od">숫자 음식을 먹어서 넘버블럭을 키워요!<br>먹을수록 숫자가 커져요 🎉</div>
    <button class="bigbtn" id="startbtn" onclick="startGame()">시작하기! 🎮</button>
  </div>
</div>

<div class="btmrow">
  <button class="rbtn" onclick="startGame()">🔄 다시하기</button>
  <div class="spgrp">
    <span class="splbl">속도</span>
    <button class="spbtn on"  id="sp0" onclick="setSpd(480)">🐌 느림</button>
    <button class="spbtn"     id="sp1" onclick="setSpd(300)">🐢 보통</button>
    <button class="spbtn"     id="sp2" onclick="setSpd(160)">🐇 빠름</button>
  </div>
</div>

<div class="dpad">
  <button class="dp" style="grid-area:U" onpointerdown="inp(0,-1)">⬆️</button>
  <button class="dp" style="grid-area:L" onpointerdown="inp(-1,0)">⬅️</button>
  <button class="dp" style="grid-area:R" onpointerdown="inp(1,0)">➡️</button>
  <button class="dp" style="grid-area:D" onpointerdown="inp(0,1)">⬇️</button>
</div>
<div class="hint">키보드 방향키 · 화면 버튼 · 스와이프로 조종</div>

<script>
// ── Numberblocks palette ───────────────────────────────────
const GRID = 14;

const NB = [
  null,
  { c:'#EE2222', dk:'#990000', lt:'#FFB8B8', name:'하나'  },  // 1  red
  { c:'#FF8C00', dk:'#BB5500', lt:'#FFDDA0', name:'둘'    },  // 2  orange
  { c:'#FFD700', dk:'#AA8800', lt:'#FFF5A0', name:'셋'    },  // 3  yellow
  { c:'#33BB33', dk:'#116611', lt:'#AAFFAA', name:'넷'    },  // 4  green
  { c:'#3344EE', dk:'#1122AA', lt:'#AABBFF', name:'다섯'  },  // 5  blue
  { c:'#9922BB', dk:'#660088', lt:'#DDAAFF', name:'여섯'  },  // 6  purple
  { c:'#EE1188', dk:'#AA0055', lt:'#FFAAD4', name:'일곱'  },  // 7  pink
  { c:'#FFAA00', dk:'#BB7700', lt:'#FFEAAA', name:'여덟'  },  // 8  amber
  { c:'#00AABB', dk:'#006677', lt:'#AAEEFF', name:'아홉'  },  // 9  cyan
  { c:'#FF6633', dk:'#BB3300', lt:'#FFCCAA', name:'열'    },  // 10 orange-red
];
function nb(n){ return NB[((n-1)%10)+1]; }

// ── Canvas ────────────────────────────────────────────────
const gc  = document.getElementById('gc');
const pc  = document.getElementById('pc');
const ctx = gc.getContext('2d');
const ptx = pc.getContext('2d');

function resizeCanvas(){
  const W    = Math.min(window.innerWidth * 0.95, 560);
  const cell = Math.floor(W / GRID);
  const side = cell * GRID;
  gc.width = gc.height = pc.width = pc.height = side;
  gc.style.width = gc.style.height = pc.style.width = pc.style.height = side + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function CS(){ return gc.width / GRID; }   // cell size in px

// ── Drawing helpers ───────────────────────────────────────
function rr(cx, x, y, w, h, r){
  if(w<=0||h<=0) return;
  const R = Math.min(r, w/2, h/2);
  cx.beginPath();
  cx.moveTo(x+R, y);
  cx.lineTo(x+w-R, y);   cx.arcTo(x+w, y,   x+w, y+R,   R);
  cx.lineTo(x+w, y+h-R); cx.arcTo(x+w, y+h, x+w-R, y+h, R);
  cx.lineTo(x+R, y+h);   cx.arcTo(x,   y+h, x,   y+h-R, R);
  cx.lineTo(x, y+R);     cx.arcTo(x,   y,   x+R, y,     R);
  cx.closePath();
}

function drawBg(){
  const s = gc.width;
  const g = ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#0e1828');
  g.addColorStop(1,'#190830');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,s,s);
  const c = CS();
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth   = 1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*c,0); ctx.lineTo(i*c,s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*c); ctx.lineTo(s,i*c); ctx.stroke();
  }
}

// Draw a Numberblock-style colored block
function drawNBBlock(x, y, sz, b, rad){
  // Colored face
  ctx.fillStyle = b.c;
  rr(ctx, x, y, sz, sz, rad);
  ctx.fill();

  // Top-left diagonal shine → gives depth
  const shine = ctx.createLinearGradient(x, y, x+sz*0.7, y+sz*0.7);
  shine.addColorStop(0,   'rgba(255,255,255,0.45)');
  shine.addColorStop(0.5, 'rgba(255,255,255,0.06)');
  shine.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  rr(ctx, x, y, sz, sz, rad);
  ctx.fill();

  // Bottom edge shadow (3-D feel)
  ctx.fillStyle = b.dk + '99';
  rr(ctx, x, y+sz*0.80, sz, sz*0.20, Math.min(rad, sz*0.10));
  ctx.fill();

  // Border
  ctx.strokeStyle = b.dk;
  ctx.lineWidth   = 2;
  rr(ctx, x, y, sz, sz, rad);
  ctx.stroke();
}

// Numberblocks trademark: white rectangular eyes with round pupils
function drawNBEyes(ox, oy, C, dir){
  // Portrait eye (for L/R movement): narrow-wide
  // Landscape eye (for U/D movement): wide-narrow
  const ew = C * 0.12;   // half short-axis
  const eh = C * 0.20;   // half long-axis

  let p1, p2, w, h;
  if(dir.x===1){            // → right  – eyes on right, portrait
    p1={x:ox+C*0.83, y:oy+C*0.28}; p2={x:ox+C*0.83, y:oy+C*0.64};
    w=ew; h=eh;
  } else if(dir.x===-1){   // ← left   – eyes on left, portrait
    p1={x:ox+C*0.17, y:oy+C*0.28}; p2={x:ox+C*0.17, y:oy+C*0.64};
    w=ew; h=eh;
  } else if(dir.y===-1){   // ↑ up     – eyes on top, landscape
    p1={x:ox+C*0.27, y:oy+C*0.17}; p2={x:ox+C*0.66, y:oy+C*0.17};
    w=eh; h=ew;             // swap → landscape
  } else {                  // ↓ down   – eyes on bottom, landscape
    p1={x:ox+C*0.27, y:oy+C*0.83}; p2={x:ox+C*0.66, y:oy+C*0.83};
    w=eh; h=ew;
  }

  for(const e of [p1,p2]){
    // White rectangle
    ctx.fillStyle   = 'white';
    rr(ctx, e.x-w, e.y-h, w*2, h*2, 3);
    ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth   = 1;
    rr(ctx, e.x-w, e.y-h, w*2, h*2, 3);
    ctx.stroke();

    // Dark pupil
    const pr = Math.min(w,h)*0.65;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(e.x, e.y, pr, 0, Math.PI*2); ctx.fill();

    // White glint
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(e.x+w*0.22, e.y-h*0.24, pr*0.42, 0, Math.PI*2); ctx.fill();
  }
}

// Smile arc on the face side
function drawSmile(ox, oy, C, dir){
  let cx, cy;
  if(dir.x===1)        { cx=ox+C*0.83; cy=oy+C*0.84; }
  else if(dir.x===-1) { cx=ox+C*0.17; cy=oy+C*0.84; }
  else if(dir.y===-1) { cx=ox+C*0.50; cy=oy+C*0.36; }
  else                 { cx=ox+C*0.50; cy=oy+C*0.64; }
  ctx.strokeStyle = '#333';
  ctx.lineWidth   = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, C*0.09, 0.1*Math.PI, 0.9*Math.PI);
  ctx.stroke();
}

function drawHead(gx, gy, num, dir){
  const C  = CS();
  const b  = nb(num);
  const px = gx*C+2, py = gy*C+2, sz = C-4;

  ctx.shadowColor = b.c;
  ctx.shadowBlur  = 14;
  drawNBBlock(px, py, sz, b, 10);
  ctx.shadowBlur  = 0;

  // Number — centered, large, white
  const fs = num >= 10 ? Math.round(C*0.36) : Math.round(C*0.44);
  ctx.font         = `bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle  = b.dk;
  ctx.lineWidth    = 3;
  ctx.strokeText(String(num), gx*C+C/2, gy*C+C/2+1);
  ctx.fillStyle    = 'white';
  ctx.fillText(String(num), gx*C+C/2, gy*C+C/2+1);

  // Numberblocks face
  drawNBEyes(gx*C, gy*C, C, dir);
  drawSmile (gx*C, gy*C, C, dir);
}

function drawBodySeg(gx, gy, num, idx, total){
  const C    = CS();
  const b    = nb(num);
  const fade = Math.max(0.35, 1 - idx/(total+4));
  const px   = gx*C+4, py = gy*C+4, sz = C-8;
  ctx.globalAlpha = fade;
  drawNBBlock(px, py, sz, b, 7);
  ctx.globalAlpha = 1;
}

function drawFoodItem(gx, gy, nextNum){
  const C     = CS();
  const b     = nb(nextNum);
  const t     = Date.now()/500;
  const pulse = 1 + Math.sin(t)*0.09;
  const sz    = C*0.70*pulse;
  const off   = (C-sz)/2;

  ctx.shadowColor = b.c;
  ctx.shadowBlur  = 20;
  drawNBBlock(gx*C+off, gy*C+off, sz, b, 9);
  ctx.shadowBlur  = 0;

  const fs = nextNum >= 10 ? Math.round(C*0.30) : Math.round(C*0.36);
  ctx.font         = `bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle  = b.dk;
  ctx.lineWidth    = 2.5;
  ctx.strokeText(String(nextNum), gx*C+C/2, gy*C+C/2);
  ctx.fillStyle    = 'white';
  ctx.fillText(String(nextNum), gx*C+C/2, gy*C+C/2);

  // orbiting sparkles
  for(let i=0;i<5;i++){
    const a = t*1.9 + i*Math.PI*2/5;
    const r = sz*0.55+6;
    ctx.globalAlpha = 0.6 + Math.sin(t*2+i)*0.4;
    ctx.fillStyle   = b.lt;
    ctx.beginPath();
    ctx.arc(gx*C+C/2+Math.cos(a)*r, gy*C+C/2+Math.sin(a)*r, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── Particles (on separate canvas) ────────────────────────
let parts = [];
function burst(cx, cy, color, light){
  for(let i=0;i<20;i++){
    const a = Math.random()*Math.PI*2;
    const v = 1.5 + Math.random()*5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,
                life:1, sz:3+Math.random()*5,
                col: Math.random()>.45 ? color : light});
  }
}
function tickParts(){
  ptx.clearRect(0,0,pc.width,pc.height);
  parts = parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.028;
    ptx.globalAlpha = Math.max(0, p.life*p.life);
    ptx.fillStyle   = p.col;
    ptx.beginPath(); ptx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ptx.fill();
  }
  ptx.globalAlpha = 1;
}

// ── Audio ─────────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx){
    audioCtx = new(window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
const NOTES = [262,294,330,349,392,440,494,523,587,659];
function sfxEat(n){
  try{
    const a = getAudio();
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'triangle';
    const f = NOTES[(n-1)%10];
    osc.frequency.setValueAtTime(f, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f*1.6, a.currentTime+0.12);
    g.gain.setValueAtTime(0.25, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.28);
    osc.start(a.currentTime);
    osc.stop(a.currentTime+0.3);
  } catch(e){}
}
function sfxDie(){
  try{
    const a = getAudio();
    const osc = a.createOscillator(), g = a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, a.currentTime+0.6);
    g.gain.setValueAtTime(0.22, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.6);
    osc.start(a.currentTime);
    osc.stop(a.currentTime+0.65);
  } catch(e){}
}

// ── Game state ────────────────────────────────────────────
let snake   = [];
let dir     = {x:1,y:0};
let nextDir = {x:1,y:0};
let food    = null;
let score   = 0;
let best    = 0;
let running = false;
let speed   = 480;

// ── Two independent timers ────────────────────────────────
// tickTimer  → setInterval  → drives game LOGIC
// rafId      → RAF          → drives RENDERING only
let tickTimer = null;
let rafId     = null;

function startTickTimer(){
  clearInterval(tickTimer);
  tickTimer = setInterval(gameTick, speed);
}
function stopTickTimer(){
  clearInterval(tickTimer);
  tickTimer = null;
}
function startRenderLoop(){
  cancelAnimationFrame(rafId);
  function frame(){
    draw();
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}
function stopRenderLoop(){
  cancelAnimationFrame(rafId);
  rafId = null;
}

// ── Game logic tick (called by setInterval) ───────────────
function gameTick(){
  if(!running){ stopTickTimer(); return; }

  // Apply queued direction change
  dir = {x:nextDir.x, y:nextDir.y};

  // Compute new head position (wraps around edges)
  const hx = (snake[0].x + dir.x + GRID) % GRID;
  const hy = (snake[0].y + dir.y + GRID) % GRID;

  // Self-collision check — only check segments EXCEPT the tail
  // (tail moves away on non-eating ticks; on eating ticks tail stays
  //  but food can never be at a snake position so head→tail never happens)
  for(let i = 0; i < snake.length - 1; i++){
    if(snake[i].x === hx && snake[i].y === hy){
      gameOver();
      return;
    }
  }

  // Eating check
  const eating = (food !== null && hx === food.x && hy === food.y);

  // Move snake
  snake.unshift({x:hx, y:hy});
  if(!eating){
    snake.pop();
  }

  if(eating){
    score++;
    best = Math.max(best, score);
    document.getElementById('sv').textContent = score;
    document.getElementById('bv').textContent = best;
    updateNBLabel();
    food = randomFood();
    const C = CS();
    burst(hx*C+C/2, hy*C+C/2, nb(snake.length).c, nb(snake.length).lt);
    sfxEat(snake.length);
  }
}

// ── Helpers ───────────────────────────────────────────────
function randomFood(){
  const occ = new Set(snake.map(s=>s.x+','+s.y));
  let p, tries = 0;
  do{
    p = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
    tries++;
  } while(occ.has(p.x+','+p.y) && tries < 500);
  return p;
}

function updateNBLabel(){
  const n = snake.length;
  const b = nb(n);
  const lbl = document.getElementById('nblabel');
  lbl.textContent  = `넘버블럭 ${n} (${b.name})이에요!`;
  lbl.style.color        = b.c;
  lbl.style.borderColor  = b.c;
  lbl.style.background   = b.c + '18';
}

// ── Render ────────────────────────────────────────────────
function draw(){
  drawBg();
  // body (tail-first so head draws on top)
  for(let i = snake.length-1; i >= 1; i--){
    drawBodySeg(snake[i].x, snake[i].y, snake.length, i, snake.length);
  }
  // head
  if(snake.length > 0){
    drawHead(snake[0].x, snake[0].y, snake.length, dir);
  }
  // food
  if(food){
    drawFoodItem(food.x, food.y, snake.length+1);
  }
  tickParts();
}

// ── Lifecycle ─────────────────────────────────────────────
function gameOver(){
  running = false;
  stopTickTimer();
  sfxDie();

  const n = snake.length, b = nb(n);
  document.getElementById('oi').textContent   = '😢';
  document.getElementById('ot').style.color   = '#FF5555';
  document.getElementById('ot').textContent   = '게임 오버!';
  document.getElementById('od').innerHTML     =
    `넘버블럭 <b style="color:${b.c}">${n}</b>까지 키웠어요!<br>` +
    `점수: <b style="color:#FFD700">${score}점</b>`;
  document.getElementById('startbtn').textContent = '다시하기! 🔄';

  setTimeout(()=>{ document.getElementById('ov').classList.remove('hidden'); }, 120);
  // Render keeps going so particles finish, then we stop after overlay shows
}

function startGame(){
  // Unlock audio on first user gesture
  try{ getAudio(); } catch(e){}

  // Stop any running timers
  stopTickTimer();
  stopRenderLoop();
  running = false;

  // Reset state
  snake   = [{x: GRID>>1, y: GRID>>1}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
  score   = 0;
  parts   = [];
  food    = randomFood();

  // Reset UI
  document.getElementById('sv').textContent = 0;
  document.getElementById('oi').textContent = '🔢';
  document.getElementById('ot').style.color = '#FFD700';
  document.getElementById('ov').classList.add('hidden');
  document.getElementById('startbtn').textContent = '시작하기! 🎮';
  updateNBLabel();

  // Start both loops
  running = true;
  startTickTimer();   // game logic: setInterval(gameTick, speed)
  startRenderLoop();  // rendering:  requestAnimationFrame loop
}

// ── Speed control ─────────────────────────────────────────
const SPD = {480:'sp0', 300:'sp1', 160:'sp2'};
function setSpd(ms){
  speed = ms;
  document.querySelectorAll('.spbtn').forEach(b=>b.classList.remove('on'));
  const el = document.getElementById(SPD[ms]);
  if(el) el.classList.add('on');
  if(running) startTickTimer();  // restart interval with new speed
}

// ── Input ─────────────────────────────────────────────────
function inp(dx, dy){
  if(!running) return;
  // Block 180-degree reversal
  if(dx + dir.x === 0 && dy + dir.y === 0) return;
  nextDir = {x:dx, y:dy};
}

document.addEventListener('keydown', e=>{
  const MAP = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0],
  };
  const d = MAP[e.key];
  if(!d) return;
  inp(d[0], d[1]);
  if(e.key.startsWith('Arrow')) e.preventDefault();
});

// Touch swipe
let swp = null;
document.addEventListener('touchstart', e=>{
  swp = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(!swp) return;
  const dx = e.changedTouches[0].clientX - swp.x;
  const dy = e.changedTouches[0].clientY - swp.y;
  swp = null;
  if(Math.abs(dx)<12 && Math.abs(dy)<12) return;
  Math.abs(dx)>Math.abs(dy) ? inp(dx>0?1:-1, 0) : inp(0, dy>0?1:-1);
}, {passive:true});

// ── Boot ──────────────────────────────────────────────────
drawBg();   // draw background behind overlay
</script>
