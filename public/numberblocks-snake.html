<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘버블럭스 뱀게임 🔢🐍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: radial-gradient(ellipse at top, #1a0a3e 0%, #0a1a2e 60%, #000a1a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 8px 20px;
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", Arial, sans-serif;
    overflow-x: hidden;
    user-select: none;
  }

  /* stars background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 60%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 5%,  white 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  70%, white 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 55%, rgba(255,220,100,0.8) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 30% 90%, rgba(255,220,100,0.8) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  h1 {
    color: #FFD700;
    font-size: clamp(1.3rem, 5vw, 2rem);
    text-shadow: 0 0 20px #FFD70099, 0 2px 4px #0008;
    margin-bottom: 8px;
    z-index: 1;
    letter-spacing: 1px;
  }

  .top-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
    z-index: 1;
  }

  .badge {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 5px 16px;
    color: white;
    font-size: 1rem;
    font-weight: bold;
  }

  .badge.gold { background: rgba(255,215,0,0.15); border-color: #FFD700; color: #FFD700; }

  #nb-status {
    z-index: 1;
    border-radius: 16px;
    padding: 6px 22px;
    font-size: 1.05rem;
    font-weight: bold;
    margin-bottom: 10px;
    transition: background 0.4s, border-color 0.4s, color 0.4s;
    border: 2px solid #FF3333;
    color: #FF3333;
    background: rgba(255,51,51,0.15);
  }

  .canvas-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 4px solid #FFD700;
    box-shadow: 0 0 40px #FFD70055, 0 0 0 1px #AA990044;
    z-index: 1;
  }

  canvas {
    display: block;
    width: min(95vw, 540px);
    height: min(95vw, 540px);
  }

  /* overlay */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,10,0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.3s;
  }

  #overlay.hidden { display: none; }

  .ov-emoji { font-size: 3.5rem; }

  .ov-title {
    font-size: clamp(1.4rem, 5vw, 2rem);
    text-align: center;
    text-shadow: 0 0 16px currentColor;
  }

  .ov-sub { color: #ccc; font-size: 1rem; text-align: center; padding: 0 24px; line-height: 1.6; }

  #start-btn {
    background: linear-gradient(135deg, #FFD700, #FF9900);
    color: #222;
    border: none;
    border-radius: 32px;
    padding: 14px 44px;
    font-size: 1.4rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 24px #FFD70066;
    transition: transform 0.12s, box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
  }

  #start-btn:hover  { transform: scale(1.06); box-shadow: 0 6px 30px #FFD70099; }
  #start-btn:active { transform: scale(0.97); }

  /* D-pad */
  .dpad {
    display: grid;
    grid-template-areas: ". up ." "left center right" ". down .";
    gap: 8px;
    margin-top: 14px;
    z-index: 1;
  }

  .dpad-btn {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    font-size: 1.9rem;
    color: white;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .dpad-btn:active { background: rgba(255,255,255,0.25); transform: scale(0.93); }

  .dpad-center { grid-area: center; pointer-events: none; }

  .hint { color: #555; font-size: 0.82rem; margin-top: 6px; z-index: 1; }

  /* particle canvas overlay */
  #particles { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
</style>
</head>
<body>

<h1>🔢 넘버블럭스 뱀게임 🐍</h1>

<div class="top-bar">
  <div class="badge">점수: <span id="score-disp">0</span></div>
  <div class="badge gold">최고: <span id="best-disp">0</span></div>
</div>

<div id="nb-status">넘버블럭 1 (하나)이에요!</div>

<div class="canvas-wrap">
  <canvas id="game"></canvas>
  <canvas id="particles"></canvas>

  <div id="overlay">
    <div class="ov-emoji" id="ov-emoji">🐍</div>
    <div class="ov-title" id="ov-title" style="color:#FFD700">넘버블럭스 뱀게임!</div>
    <div class="ov-sub" id="ov-sub">숫자 음식을 먹어서<br>넘버블럭을 키워요! 🎉</div>
    <button id="start-btn" onclick="startGame()">시작하기! 🎮</button>
  </div>
</div>

<div class="dpad">
  <button class="dpad-btn" style="grid-area:up"    onpointerdown="pressDir(0,-1)">⬆️</button>
  <button class="dpad-btn" style="grid-area:left"  onpointerdown="pressDir(-1,0)">⬅️</button>
  <div class="dpad-center"></div>
  <button class="dpad-btn" style="grid-area:right" onpointerdown="pressDir(1,0)">➡️</button>
  <button class="dpad-btn" style="grid-area:down"  onpointerdown="pressDir(0,1)">⬇️</button>
</div>

<div class="hint">방향키 또는 화면 버튼 또는 스와이프로 조종하세요</div>

<script>
// ─── constants ───────────────────────────────────────────────
const GRID  = 15;
const SPEED = 290; // ms per tick (slow for kids)

const NB = {
  1:  { color:"#FF3333", dark:"#AA0000", light:"#FFAAAA", name:"하나" },
  2:  { color:"#FF8800", dark:"#BB5500", light:"#FFCC88", name:"둘"   },
  3:  { color:"#FFD700", dark:"#AA8800", light:"#FFF0AA", name:"셋"   },
  4:  { color:"#33BB33", dark:"#116611", light:"#99EE99", name:"넷"   },
  5:  { color:"#4455EE", dark:"#1122AA", light:"#AABBFF", name:"다섯" },
  6:  { color:"#9933CC", dark:"#660099", light:"#CC99EE", name:"여섯" },
  7:  { color:"#FF3399", dark:"#BB0066", light:"#FF99CC", name:"일곱" },
  8:  { color:"#FF9900", dark:"#BB6600", light:"#FFCC66", name:"여덟" },
  9:  { color:"#00AADD", dark:"#006699", light:"#88DDFF", name:"아홉" },
  10: { color:"#FF5533", dark:"#CC2200", light:"#FFAA99", name:"열"   },
};

function nb(n) { return NB[((n - 1) % 10) + 1]; }

// ─── canvas setup ────────────────────────────────────────────
const gc  = document.getElementById("game");
const pc  = document.getElementById("particles");
const ctx = gc.getContext("2d");
const ptx = pc.getContext("2d");

function resize() {
  const size = Math.min(window.innerWidth * 0.95, 540);
  const cell = Math.floor(size / GRID);
  gc.width  = pc.width  = cell * GRID;
  gc.height = pc.height = cell * GRID;
  gc.style.width  = pc.style.width  = cell * GRID + "px";
  gc.style.height = pc.style.height = cell * GRID + "px";
}
resize();
window.addEventListener("resize", () => { resize(); if (!running) drawIdle(); });

function CELL() { return gc.width / GRID; }

// ─── game state ──────────────────────────────────────────────
let snake, dir, nextDir, food, score, best = 0;
let running = false, ticker = null, rafId = null;

// ─── particles ───────────────────────────────────────────────
let particles = [];

function spawnParticles(cx, cy, color) {
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.3;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      size: 4 + Math.random() * 5,
      color,
    });
  }
}

function updateParticles() {
  ptx.clearRect(0, 0, pc.width, pc.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x  += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.032;
    ptx.globalAlpha = Math.max(0, p.life);
    ptx.fillStyle = p.color;
    ptx.beginPath();
    ptx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ptx.fill();
  }
  ptx.globalAlpha = 1;
}

// ─── sound (Web Audio API) ───────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playEat(num) {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    const base = 220 * Math.pow(2, ((num - 1) % 12) / 12);
    osc.frequency.setValueAtTime(base, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(base * 2, a.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
    osc.type = "triangle";
    osc.start(); osc.stop(a.currentTime + 0.3);
  } catch(e) {}
}

function playDie() {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.frequency.setValueAtTime(300, a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    osc.type = "sawtooth";
    osc.start(); osc.stop(a.currentTime + 0.5);
  } catch(e) {}
}

// ─── drawing helpers ─────────────────────────────────────────
function rr(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x+r,y);
  cx.lineTo(x+w-r,y); cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r); cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  cx.lineTo(x+r,y+h); cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r); cx.quadraticCurveTo(x,y,x+r,y);
  cx.closePath();
}

function drawBg() {
  const C = CELL();
  const g = ctx.createLinearGradient(0,0,gc.width,gc.height);
  g.addColorStop(0,"#0d1b2a"); g.addColorStop(1,"#1a0a2e");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,gc.width,gc.height);
  ctx.strokeStyle = "rgba(255,255,255,0.035)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i*C,0); ctx.lineTo(i*C,gc.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*C); ctx.lineTo(gc.width,i*C); ctx.stroke();
  }
}

function drawBlock(x, y, num, isHead, dirObj, alpha) {
  const C = CELL();
  const data = nb(num);
  const px = x * C, py = y * C;
  const pad = isHead ? 2 : 4;
  const r   = isHead ? 10 : 7;

  ctx.globalAlpha = alpha ?? 1;
  ctx.shadowColor = data.color;
  ctx.shadowBlur  = isHead ? 14 : 0;

  // main face
  ctx.fillStyle   = data.color;
  ctx.strokeStyle = data.dark;
  ctx.lineWidth   = isHead ? 3 : 2;
  rr(ctx, px+pad, py+pad, C-pad*2, C-pad*2, r);
  ctx.fill(); ctx.stroke();

  ctx.shadowBlur = 0;

  if (isHead) {
    // shine
    ctx.fillStyle = data.light + "44";
    rr(ctx, px+pad+4, py+pad+4, C-pad*2-8, (C-pad*2)*0.38, 5);
    ctx.fill();

    // number
    ctx.fillStyle   = "white";
    ctx.strokeStyle = data.dark;
    ctx.lineWidth   = 3;
    ctx.font        = `bold ${Math.round(C * 0.42)}px "Arial Rounded MT Bold", Arial`;
    ctx.textAlign   = "center";
    ctx.textBaseline = "middle";
    ctx.strokeText(String(num), px + C/2, py + C/2 + 2);
    ctx.fillText  (String(num), px + C/2, py + C/2 + 2);

    // eyes
    const ew = C * 0.12, eh = C * 0.16;
    let e1, e2;
    const d = dirObj;
    if      (d.x===1)  { e1=[px+C*0.78,py+C*0.28]; e2=[px+C*0.78,py+C*0.62]; }
    else if (d.x===-1) { e1=[px+C*0.22,py+C*0.28]; e2=[px+C*0.22,py+C*0.62]; }
    else if (d.y===-1) { e1=[px+C*0.28,py+C*0.22]; e2=[px+C*0.62,py+C*0.22]; }
    else               { e1=[px+C*0.28,py+C*0.78]; e2=[px+C*0.62,py+C*0.78]; }

    const horiz = (d.y !== 0);
    for (const [ex,ey] of [e1,e2]) {
      ctx.fillStyle   = "white";
      ctx.strokeStyle = "#222";
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.ellipse(ex, ey, horiz ? eh : ew, horiz ? ew : eh, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#111";
      ctx.beginPath(); ctx.arc(ex, ey, ew*0.58, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "white";
      ctx.beginPath(); ctx.arc(ex+ew*0.2, ey-eh*0.2, ew*0.22, 0, Math.PI*2); ctx.fill();
    }
  } else {
    // body dot
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.beginPath(); ctx.arc(px+C/2, py+C/2, C*0.1, 0, Math.PI*2); ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function drawFood(fx, fy, nextNum) {
  const C = CELL();
  const data = nb(nextNum);
  const px = fx*C, py = fy*C;
  const t = Date.now()/400;
  const pulse = 1 + Math.sin(t) * 0.09;
  const s = C * 0.73 * pulse;
  const off = (C - s) / 2;

  ctx.shadowColor = data.color;
  ctx.shadowBlur  = 22;
  ctx.fillStyle   = data.color;
  ctx.strokeStyle = data.dark;
  ctx.lineWidth   = 2;
  rr(ctx, px+off, py+off, s, s, 9);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;

  // shine
  ctx.fillStyle = data.light + "55";
  rr(ctx, px+off+3, py+off+3, s-6, s*0.36, 5);
  ctx.fill();

  // number
  ctx.fillStyle   = "white";
  ctx.strokeStyle = data.dark;
  ctx.lineWidth   = 2.5;
  ctx.font        = `bold ${Math.round(C*0.38)}px "Arial Rounded MT Bold", Arial`;
  ctx.textAlign   = "center";
  ctx.textBaseline = "middle";
  ctx.strokeText(String(nextNum), px+C/2, py+C/2);
  ctx.fillText  (String(nextNum), px+C/2, py+C/2);

  // orbiting sparkles
  for (let i=0; i<4; i++) {
    const a = t*1.6 + i*Math.PI/2;
    const r = s/2 + 7;
    ctx.fillStyle = "white";
    ctx.globalAlpha = 0.7 + Math.sin(t*2+i)*0.3;
    ctx.beginPath();
    ctx.arc(px+C/2+Math.cos(a)*r, py+C/2+Math.sin(a)*r, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── full frame ──────────────────────────────────────────────
function drawFrame() {
  drawBg();
  // body (tail → just-before-head)
  for (let i = snake.length-1; i >= 1; i--) {
    const fade = Math.max(0.45, 1 - i / (snake.length + 3));
    drawBlock(snake[i].x, snake[i].y, snake.length, false, dir, fade);
  }
  // head
  drawBlock(snake[0].x, snake[0].y, snake.length, true, dir, 1);
  // food
  drawFood(food.x, food.y, snake.length + 1);

  updateParticles();
  rafId = requestAnimationFrame(drawFrame);
}

// ─── idle animation ──────────────────────────────────────────
function drawIdle() {
  drawBg();
  // show a sample numberblock 1 in center
  const C = CELL();
  drawBlock(Math.floor(GRID/2), Math.floor(GRID/2), 1, true, {x:1,y:0}, 1);
}

// ─── game logic ──────────────────────────────────────────────
function placeFood() {
  let p;
  do { p = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) }; }
  while (snake.some(s => s.x===p.x && s.y===p.y));
  food = p;
}

function updateStatus() {
  const n    = snake.length;
  const data = nb(n);
  const el   = document.getElementById("nb-status");
  el.textContent  = `넘버블럭 ${n} (${data.name})이에요! 🎉`;
  el.style.color        = data.color;
  el.style.borderColor  = data.color;
  el.style.background   = data.color + "22";
}

function tick() {
  if (!running) return;
  dir = { ...nextDir };
  const head = {
    x: (snake[0].x + dir.x + GRID) % GRID,
    y: (snake[0].y + dir.y + GRID) % GRID,
  };
  // self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) { gameOver(); return; }

  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score++;
    if (score > best) { best = score; document.getElementById("best-disp").textContent = best; }
    document.getElementById("score-disp").textContent = score;
    updateStatus();
    // particle burst at food center
    const C = CELL();
    spawnParticles(food.x*C + C/2, food.y*C + C/2, nb(snake.length).color);
    playEat(snake.length);
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  clearInterval(ticker);
  playDie();
  // brief flash
  setTimeout(() => {
    cancelAnimationFrame(rafId);
    drawBg();
    const ov = document.getElementById("overlay");
    document.getElementById("ov-emoji").textContent  = "😢";
    document.getElementById("ov-title").style.color  = "#FF5555";
    document.getElementById("ov-title").textContent  = "게임 오버!";
    document.getElementById("ov-sub").innerHTML      =
      `넘버블럭 <b style="color:${nb(snake.length).color}">${snake.length}</b>까지 키웠어요!<br>점수: <b style="color:#FFD700">${score}점</b>`;
    document.getElementById("start-btn").textContent = "다시하기! 🔄";
    ov.classList.remove("hidden");
  }, 200);
}

function startGame() {
  // unlock audio
  try { getAudio(); } catch(e) {}

  snake   = [{ x: Math.floor(GRID/2), y: Math.floor(GRID/2) }];
  dir     = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score   = 0;
  particles = [];
  document.getElementById("score-disp").textContent = 0;

  placeFood();
  updateStatus();

  document.getElementById("overlay").classList.add("hidden");
  cancelAnimationFrame(rafId);
  clearInterval(ticker);
  running = true;
  ticker  = setInterval(tick, SPEED);
  drawFrame();
}

// ─── controls ────────────────────────────────────────────────
function pressDir(dx, dy) {
  if (!running) return;
  if (dx + dir.x === 0 && dy + dir.y === 0) return;
  nextDir = { x: dx, y: dy };
}

document.addEventListener("keydown", e => {
  const map = {
    ArrowUp:    [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
  };
  const d = map[e.key];
  if (!d) return;
  pressDir(d[0], d[1]);
  if (e.key.startsWith("Arrow")) e.preventDefault();
});

// swipe
let tx0 = null, ty0 = null;
document.addEventListener("touchstart", e => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (tx0 === null) return;
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > Math.abs(dy)) pressDir(dx > 0 ? 1 : -1, 0);
  else pressDir(0, dy > 0 ? 1 : -1);
  tx0 = ty0 = null;
}, { passive: true });

// ─── initial render ──────────────────────────────────────────
drawIdle();
</script>
</body>
</html>
