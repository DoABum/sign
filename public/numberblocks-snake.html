<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘버블럭스 뱀게임 🔢</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:10px 8px 20px;
  background:radial-gradient(ellipse at 30% 20%,#1e0a44 0%,#0a1530 50%,#000a18 100%);
  font-family:"Arial Rounded MT Bold","Comic Sans MS",Arial,sans-serif;
  overflow-x:hidden;user-select:none;color:white;
}
h1{font-size:clamp(1.2rem,5vw,1.9rem);color:#FFD700;text-shadow:0 0 18px #FFD70077;
   margin-bottom:7px;z-index:1;letter-spacing:1px;}
.topbar{display:flex;gap:10px;margin-bottom:7px;z-index:1;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.18);
      border-radius:20px;padding:4px 14px;font-size:.9rem;font-weight:bold;}
.pill.gold{background:rgba(255,215,0,.14);border-color:#FFD700;color:#FFD700;}
#nblabel{z-index:1;font-size:.92rem;font-weight:bold;padding:4px 18px;border-radius:20px;
         border:2px solid #FF3333;color:#FF3333;background:rgba(255,51,51,.11);
         margin-bottom:8px;white-space:nowrap;}
.wrap{position:relative;border-radius:14px;overflow:hidden;
      border:4px solid #FFD700;box-shadow:0 0 38px #FFD70044;z-index:1;}
canvas{display:block;}
#pc{position:absolute;inset:0;pointer-events:none;}
#ov{position:absolute;inset:0;background:rgba(0,0,14,.84);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;
    border-radius:10px;}
#ov.hidden{display:none;}
.ov-icon{font-size:3.8rem;}
.ov-title{font-size:clamp(1.3rem,4vw,1.9rem);text-align:center;}
.ov-desc{font-size:.9rem;color:#bbb;text-align:center;padding:0 18px;line-height:1.65;}
.bigbtn{background:linear-gradient(135deg,#FFD700,#FF9900);color:#1a1000;border:none;
        border-radius:30px;padding:12px 40px;font-size:1.3rem;font-weight:bold;
        font-family:inherit;cursor:pointer;box-shadow:0 4px 18px #FFD70055;}
.btmrow{display:flex;gap:10px;margin-top:11px;z-index:1;flex-wrap:wrap;justify-content:center;align-items:center;}
.rbtn{background:rgba(255,80,80,.16);border:1.5px solid rgba(255,100,100,.35);
      color:#FF9999;border-radius:18px;padding:6px 16px;font-size:.88rem;
      font-family:inherit;cursor:pointer;}
.spgrp{display:flex;gap:5px;align-items:center;}
.splbl{font-size:.82rem;color:#777;}
.spbtn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);
       color:#aaa;border-radius:15px;padding:5px 12px;font-size:.85rem;
       font-family:inherit;cursor:pointer;}
.spbtn.on{background:rgba(100,210,255,.2);border-color:#55BBFF;color:#88DDFF;}
.dpad{display:grid;grid-template-areas:". U ." "L . R" ". D .";gap:7px;margin-top:9px;z-index:1;}
.dp{width:58px;height:58px;background:rgba(255,255,255,.09);
    border:2px solid rgba(255,255,255,.17);border-radius:13px;font-size:1.7rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;}
.dp:active{background:rgba(255,255,255,.23);}
.hint{color:#444;font-size:.76rem;margin-top:5px;z-index:1;}
</style>
</head>
<body>

<h1>🔢 넘버블럭스 뱀게임 🐍</h1>
<div class="topbar">
  <div class="pill">점수 <span id="sv">0</span></div>
  <div class="pill gold">최고 <span id="bv">0</span></div>
</div>
<div id="nblabel">넘버블럭 1 (하나)이에요!</div>

<div class="wrap">
  <canvas id="gc"></canvas>
  <canvas id="pc"></canvas>
  <div id="ov">
    <div class="ov-icon" id="oi">🔢</div>
    <div class="ov-title" id="ot" style="color:#FFD700">넘버블럭스 뱀게임!</div>
    <div class="ov-desc"  id="od">숫자 음식을 먹어서 넘버블럭을 키워요!<br>먹을수록 숫자가 커져요 🎉</div>
    <button class="bigbtn" onclick="startGame()">시작하기! 🎮</button>
  </div>
</div>

<div class="btmrow">
  <button class="rbtn" onclick="startGame()">🔄 다시하기</button>
  <div class="spgrp">
    <span class="splbl">속도</span>
    <button class="spbtn on" id="sp0" onclick="setSpd(480)">🐌 느림</button>
    <button class="spbtn"    id="sp1" onclick="setSpd(300)">🐢 보통</button>
    <button class="spbtn"    id="sp2" onclick="setSpd(160)">🐇 빠름</button>
  </div>
</div>
<div class="dpad">
  <button class="dp" style="grid-area:U" onpointerdown="inp(0,-1)">⬆️</button>
  <button class="dp" style="grid-area:L" onpointerdown="inp(-1,0)">⬅️</button>
  <button class="dp" style="grid-area:R" onpointerdown="inp(1,0)">➡️</button>
  <button class="dp" style="grid-area:D" onpointerdown="inp(0,1)">⬇️</button>
</div>
<div class="hint">키보드 방향키 · 화면 버튼 · 스와이프로 조종</div>

<script>
// ── Numberblocks colours ──────────────────────────────────
const GRID = 14;
const NB = [
  null,
  {c:'#EE2222',dk:'#990000',lt:'#FFB8B8',name:'하나'},
  {c:'#FF8C00',dk:'#BB5500',lt:'#FFDDA0',name:'둘'},
  {c:'#FFD700',dk:'#AA8800',lt:'#FFF5A0',name:'셋'},
  {c:'#33BB33',dk:'#116611',lt:'#AAFFAA',name:'넷'},
  {c:'#3344EE',dk:'#1122AA',lt:'#AABBFF',name:'다섯'},
  {c:'#9922BB',dk:'#660088',lt:'#DDAAFF',name:'여섯'},
  {c:'#EE1188',dk:'#AA0055',lt:'#FFAAD4',name:'일곱'},
  {c:'#FFAA00',dk:'#BB7700',lt:'#FFEAAA',name:'여덟'},
  {c:'#00AABB',dk:'#006677',lt:'#AAEEFF',name:'아홉'},
  {c:'#FF6633',dk:'#BB3300',lt:'#FFCCAA',name:'열'},
];
function nb(n){ return NB[((n-1)%10)+1]; }

// ── Canvas ────────────────────────────────────────────────
const gc  = document.getElementById('gc');
const pc  = document.getElementById('pc');
const ctx = gc.getContext('2d');
const ptx = pc.getContext('2d');

function resizeCanvas(){
  const W    = Math.min(window.innerWidth * 0.96, 560);
  const cell = Math.floor(W / GRID);
  const side = cell * GRID;
  gc.width = gc.height = pc.width = pc.height = side;
  gc.style.width = gc.style.height = pc.style.width = pc.style.height = side+'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function CS(){ return gc.width / GRID; }

// ── Drawing helpers ───────────────────────────────────────
function rr(cx,x,y,w,h,r){
  if(w<=0||h<=0) return;
  r=Math.min(r,w/2,h/2);
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r); cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h); cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r); cx.arcTo(x,y,x+r,y,r);
  cx.closePath();
}

function drawBlock(x,y,sz,b,rad){
  ctx.fillStyle=b.c; rr(ctx,x,y,sz,sz,rad); ctx.fill();
  const sh=ctx.createLinearGradient(x,y,x+sz*.7,y+sz*.7);
  sh.addColorStop(0,'rgba(255,255,255,.45)');
  sh.addColorStop(.5,'rgba(255,255,255,.06)');
  sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh; rr(ctx,x,y,sz,sz,rad); ctx.fill();
  if(sz*.2>0){ ctx.fillStyle=b.dk+'99'; rr(ctx,x,y+sz*.8,sz,sz*.2,Math.min(rad,sz*.1)); ctx.fill(); }
  ctx.strokeStyle=b.dk; ctx.lineWidth=2; rr(ctx,x,y,sz,sz,rad); ctx.stroke();
}

function drawEyes(ox,oy,C,d){
  const ew=C*.12, eh=C*.2;
  let p1,p2,w,h;
  if(d.x===1)      {p1={x:ox+C*.83,y:oy+C*.28};p2={x:ox+C*.83,y:oy+C*.64};w=ew;h=eh;}
  else if(d.x===-1){p1={x:ox+C*.17,y:oy+C*.28};p2={x:ox+C*.17,y:oy+C*.64};w=ew;h=eh;}
  else if(d.y===-1){p1={x:ox+C*.27,y:oy+C*.17};p2={x:ox+C*.66,y:oy+C*.17};w=eh;h=ew;}
  else             {p1={x:ox+C*.27,y:oy+C*.83};p2={x:ox+C*.66,y:oy+C*.83};w=eh;h=ew;}
  for(const e of[p1,p2]){
    ctx.fillStyle='white'; rr(ctx,e.x-w,e.y-h,w*2,h*2,3); ctx.fill();
    ctx.strokeStyle='#222'; ctx.lineWidth=1; rr(ctx,e.x-w,e.y-h,w*2,h*2,3); ctx.stroke();
    const pr=Math.min(w,h)*.65;
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(e.x,e.y,pr,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(e.x+w*.22,e.y-h*.24,pr*.42,0,Math.PI*2); ctx.fill();
  }
}

function drawSmile(ox,oy,C,d){
  let cx,cy;
  if(d.x===1)      {cx=ox+C*.83;cy=oy+C*.84;}
  else if(d.x===-1){cx=ox+C*.17;cy=oy+C*.84;}
  else if(d.y===-1){cx=ox+C*.5; cy=oy+C*.36;}
  else             {cx=ox+C*.5; cy=oy+C*.64;}
  ctx.strokeStyle='#333'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(cx,cy,C*.09,.1*Math.PI,.9*Math.PI); ctx.stroke();
}

function drawHead(gx,gy,num,d){
  const C=CS(), b=nb(num), px=gx*C+2, py=gy*C+2, sz=C-4;
  ctx.shadowColor=b.c; ctx.shadowBlur=14;
  drawBlock(px,py,sz,b,10);
  ctx.shadowBlur=0;
  const fs=num>=10?Math.round(C*.36):Math.round(C*.44);
  ctx.font=`bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle=b.dk; ctx.lineWidth=3;
  ctx.strokeText(String(num),gx*C+C/2,gy*C+C/2+1);
  ctx.fillStyle='white'; ctx.fillText(String(num),gx*C+C/2,gy*C+C/2+1);
  drawEyes(gx*C,gy*C,C,d);
  drawSmile(gx*C,gy*C,C,d);
}

function drawBody(gx,gy,num,idx,total){
  const C=CS(), b=nb(num), fade=Math.max(.35,1-idx/(total+4));
  const px=gx*C+4, py=gy*C+4, sz=C-8;
  if(sz<=0) return;
  ctx.globalAlpha=fade;
  drawBlock(px,py,sz,b,7);
  ctx.globalAlpha=1;
}

function drawFood(gx,gy,nextNum){
  const C=CS(), b=nb(nextNum), t=Date.now()/500;
  const pulse=1+Math.sin(t)*.09, sz=C*.70*pulse, off=(C-sz)/2;
  ctx.shadowColor=b.c; ctx.shadowBlur=20;
  drawBlock(gx*C+off,gy*C+off,sz,b,9);
  ctx.shadowBlur=0;
  const fs=nextNum>=10?Math.round(C*.30):Math.round(C*.36);
  ctx.font=`bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle=b.dk; ctx.lineWidth=2.5;
  ctx.strokeText(String(nextNum),gx*C+C/2,gy*C+C/2);
  ctx.fillStyle='white'; ctx.fillText(String(nextNum),gx*C+C/2,gy*C+C/2);
  for(let i=0;i<5;i++){
    const a=t*1.9+i*Math.PI*2/5, r=sz*.55+6;
    ctx.globalAlpha=.6+Math.sin(t*2+i)*.4;
    ctx.fillStyle=b.lt;
    ctx.beginPath(); ctx.arc(gx*C+C/2+Math.cos(a)*r,gy*C+C/2+Math.sin(a)*r,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ── Particles ─────────────────────────────────────────────
let parts=[];
function burst(cx,cy,col,lt){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, v=1.5+Math.random()*5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,
               life:1,sz:3+Math.random()*5,col:Math.random()>.45?col:lt});
  }
}
function tickParts(){
  ptx.clearRect(0,0,pc.width,pc.height);
  parts=parts.filter(p=>p.life>0.01);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.18; p.life-=.028;
    ptx.globalAlpha=Math.max(0,p.life*p.life);
    ptx.fillStyle=p.col;
    ptx.beginPath(); ptx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ptx.fill();
  }
  ptx.globalAlpha=1;
}

// ── Audio ─────────────────────────────────────────────────
let actx=null;
function getAudio(){
  if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
const NOTES=[262,294,330,349,392,440,494,523,587,659];
function sfxEat(n){
  try{
    const a=getAudio(),osc=a.createOscillator(),g=a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type='triangle';
    const f=NOTES[(n-1)%10];
    osc.frequency.setValueAtTime(f,a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f*1.6,a.currentTime+.12);
    g.gain.setValueAtTime(.25,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.28);
    osc.start(a.currentTime); osc.stop(a.currentTime+.3);
  }catch(e){}
}
function sfxDie(){
  try{
    const a=getAudio(),osc=a.createOscillator(),g=a.createGain();
    osc.connect(g); g.connect(a.destination);
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(260,a.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50,a.currentTime+.6);
    g.gain.setValueAtTime(.22,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);
    osc.start(a.currentTime); osc.stop(a.currentTime+.65);
  }catch(e){}
}

// ── Game state ────────────────────────────────────────────
let snake=[], dir={x:1,y:0}, nextDir={x:1,y:0};
let food=null, score=0, best=0;
let running=false, speed=480;

// ── Food placement ────────────────────────────────────────
function randomFood(){
  const occ=new Set(snake.map(s=>s.x+','+s.y));
  let p,tries=0;
  do{
    p={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};
    tries++;
  }while(occ.has(p.x+','+p.y)&&tries<500);
  return p;
}

// ── Label ─────────────────────────────────────────────────
function updateLabel(){
  const n=snake.length, b=nb(n), lbl=document.getElementById('nblabel');
  lbl.textContent=`넘버블럭 ${n} (${b.name})이에요!`;
  lbl.style.color=b.c; lbl.style.borderColor=b.c;
  lbl.style.background=b.c+'18';
}

// ── Game tick ─────────────────────────────────────────────
function gameTick(){
  // Apply queued direction
  dir={x:nextDir.x,y:nextDir.y};

  // New head position (wrap-around)
  const hx=(snake[0].x+dir.x+GRID)%GRID;
  const hy=(snake[0].y+dir.y+GRID)%GRID;

  // Self-collision: check all segments except the tail
  // (tail will vacate this tick; food is never on a snake cell so this is always safe)
  for(let i=0;i<snake.length-1;i++){
    if(snake[i].x===hx&&snake[i].y===hy){
      endGame();
      return;
    }
  }

  const eating=(food!==null&&hx===food.x&&hy===food.y);

  // Move
  snake.unshift({x:hx,y:hy});
  if(!eating) snake.pop();

  if(eating){
    score++;
    best=Math.max(best,score);
    document.getElementById('sv').textContent=score;
    document.getElementById('bv').textContent=best;
    updateLabel();
    food=randomFood();
    const C=CS();
    const b=nb(snake.length);
    burst(hx*C+C/2,hy*C+C/2,b.c,b.lt);
    sfxEat(snake.length);
  }
}

// ── Render ────────────────────────────────────────────────
function draw(){
  const s=gc.width;
  const g=ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#0e1828'); g.addColorStop(1,'#190830');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  const C=CS();
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*C,0); ctx.lineTo(i*C,s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*C); ctx.lineTo(s,i*C); ctx.stroke();
  }
  for(let i=snake.length-1;i>=1;i--) drawBody(snake[i].x,snake[i].y,snake.length,i,snake.length);
  if(snake.length>0) drawHead(snake[0].x,snake[0].y,snake.length,dir);
  if(food) drawFood(food.x,food.y,snake.length+1);
  tickParts();
}

// ── Single RAF loop (always running once started) ─────────
// Uses accumulator so game speed is independent of frame rate.
let rafId=null;
let prevTs=0;
let lag=0;

function frame(ts){
  // First frame: just record time, don't accumulate
  if(prevTs!==0){
    const dt=Math.min(ts-prevTs,250); // cap prevents giant jump after tab switch
    if(running){
      lag+=dt;
      // Drain accumulated time in fixed steps
      while(lag>=speed){
        lag-=speed;
        gameTick();
        if(!running){ lag=0; break; }
      }
    }
  }
  prevTs=ts;

  try{ draw(); }catch(e){ console.error('draw:',e); }

  rafId=requestAnimationFrame(frame);
}

function startLoop(){
  if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; }
  prevTs=0;
  lag=0;
  rafId=requestAnimationFrame(frame);
}

// ── Game over ─────────────────────────────────────────────
function endGame(){
  running=false;
  lag=0;
  sfxDie();
  const n=snake.length, b=nb(n);
  document.getElementById('oi').textContent='😢';
  document.getElementById('ot').style.color='#FF5555';
  document.getElementById('ot').textContent='게임 오버!';
  document.getElementById('od').innerHTML=
    `넘버블럭 <b style="color:${b.c}">${n}</b>까지 키웠어요!<br>` +
    `점수: <b style="color:#FFD700">${score}점</b>`;
  setTimeout(()=>{ document.getElementById('ov').classList.remove('hidden'); },150);
}

// ── Start game ────────────────────────────────────────────
function startGame(){
  try{ getAudio(); }catch(e){}

  running=false; // pause logic while resetting
  snake=[{x:GRID>>1,y:GRID>>1}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; parts=[]; food=randomFood();

  document.getElementById('sv').textContent=0;
  document.getElementById('oi').textContent='🔢';
  document.getElementById('ot').style.color='#FFD700';
  document.getElementById('ot').textContent='넘버블럭스 뱀게임!';
  document.getElementById('od').innerHTML='숫자 음식을 먹어서 넘버블럭을 키워요!<br>먹을수록 숫자가 커져요 🎉';
  document.getElementById('ov').classList.add('hidden');
  updateLabel();

  running=true;
  startLoop(); // cancel old RAF, start fresh single loop
}

// ── Speed control ─────────────────────────────────────────
function setSpd(ms){
  speed=ms;
  lag=0; // reset accumulator so new speed takes effect immediately
  document.querySelectorAll('.spbtn').forEach(b=>b.classList.remove('on'));
  const ids={480:'sp0',300:'sp1',160:'sp2'};
  const el=document.getElementById(ids[ms]);
  if(el) el.classList.add('on');
}

// ── Input ─────────────────────────────────────────────────
function inp(dx,dy){
  if(!running) return;
  if(dx+dir.x===0&&dy+dir.y===0) return; // block 180° reversal
  nextDir={x:dx,y:dy};
}

document.addEventListener('keydown',e=>{
  const MAP={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
             w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  const d=MAP[e.key]; if(!d) return;
  inp(d[0],d[1]);
  if(e.key.startsWith('Arrow')) e.preventDefault();
});

let swp=null;
document.addEventListener('touchstart',e=>{swp={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{
  if(!swp) return;
  const dx=e.changedTouches[0].clientX-swp.x, dy=e.changedTouches[0].clientY-swp.y;
  swp=null;
  if(Math.abs(dx)<12&&Math.abs(dy)<12) return;
  Math.abs(dx)>Math.abs(dy)?inp(dx>0?1:-1,0):inp(0,dy>0?1:-1);
},{passive:true});

draw(); // initial background render
