<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘버블럭스 뱀게임 👆 수동 모드</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:10px 8px 20px;
  background:linear-gradient(135deg,#dcfce7 0%,#fef9e7 100%);
  font-family:"Arial Rounded MT Bold","Comic Sans MS",Arial,sans-serif;
  overflow-x:hidden;user-select:none;color:#1e293b;
}
h1{font-size:clamp(1.2rem,5vw,1.9rem);color:#15803D;
   text-shadow:0 2px 14px rgba(21,128,61,.22);margin-bottom:4px;z-index:1;}
.subtitle{font-size:.9rem;color:#166534;margin-bottom:6px;z-index:1;font-weight:bold;}
.topbar{display:flex;gap:10px;margin-bottom:7px;z-index:1;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{background:rgba(0,0,0,.07);border:1.5px solid rgba(0,0,0,.14);
      border-radius:20px;padding:4px 14px;font-size:.9rem;font-weight:bold;color:#334155;}
.pill.gold{background:rgba(180,130,0,.12);border-color:#B45309;color:#B45309;}
#nblabel{z-index:1;font-size:.92rem;font-weight:bold;padding:4px 18px;border-radius:20px;
         border:2px solid #16A34A;color:#16A34A;background:rgba(22,163,74,.08);
         margin-bottom:8px;white-space:nowrap;}
.wrap{position:relative;border-radius:14px;overflow:hidden;
      border:4px solid #22C55E;box-shadow:0 0 30px rgba(34,197,94,.3);z-index:1;cursor:crosshair;}
canvas{display:block;}
#pc{position:absolute;inset:0;pointer-events:none;}
#pathc{position:absolute;inset:0;pointer-events:none;}
#ov{position:absolute;inset:0;background:rgba(0,0,14,.84);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;
    border-radius:10px;}
#ov.hidden{display:none;}
.ov-icon{font-size:3.8rem;}
.ov-title{font-size:clamp(1.3rem,4vw,1.9rem);text-align:center;color:#FFD700;}
.ov-desc{font-size:.9rem;color:#bbb;text-align:center;padding:0 18px;line-height:1.65;}
.bigbtn{background:linear-gradient(135deg,#22C55E,#16A34A);color:white;border:none;
        border-radius:30px;padding:12px 40px;font-size:1.3rem;font-weight:bold;
        font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(34,197,94,.5);}
.btmrow{display:flex;gap:10px;margin-top:11px;z-index:1;flex-wrap:wrap;justify-content:center;align-items:center;}
.rbtn{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.3);
      color:#DC2626;border-radius:18px;padding:6px 16px;font-size:.88rem;
      font-family:inherit;cursor:pointer;}
.spgrp{display:flex;gap:5px;align-items:center;}
.splbl{font-size:.82rem;color:#94A3B8;}
.spbtn{background:rgba(0,0,0,.06);border:1.5px solid rgba(0,0,0,.12);
       color:#64748B;border-radius:15px;padding:5px 12px;font-size:.85rem;
       font-family:inherit;cursor:pointer;}
.spbtn.on{background:rgba(21,128,61,.14);border-color:#16A34A;color:#15803D;}
.modebar{display:flex;gap:8px;margin-bottom:8px;z-index:1;}
.modebtn{background:rgba(34,197,94,.12);border:1.5px solid #22C55E;color:#15803D;
         border-radius:18px;padding:5px 16px;font-size:.85rem;font-family:inherit;
         cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.hint{color:#94A3B8;font-size:.8rem;margin-top:6px;z-index:1;text-align:center;line-height:1.6;}
#statusmsg{font-size:.88rem;font-weight:bold;color:#15803D;margin-top:4px;z-index:1;min-height:1.3em;text-align:center;}
</style>
</head>
<body>

<h1>🔢 넘버블럭스 뱀게임 🐍</h1>
<div class="subtitle">👆 수동 모드 — 화면을 터치해서 이동!</div>
<div class="modebar">
  <a href="numberblocks-snake.html" class="modebtn">🎮 자동 모드</a>
  <span class="modebtn" style="background:rgba(21,128,61,.2);">👆 수동 (현재)</span>
</div>
<div class="topbar">
  <div class="pill">점수 <span id="sv">0</span></div>
  <div class="pill gold">최고 <span id="bv">0</span></div>
</div>
<div id="nblabel">넘버블럭 1 (하나)이에요!</div>

<div class="wrap" id="gamewrap">
  <canvas id="gc"></canvas>
  <canvas id="pathc"></canvas>
  <canvas id="pc"></canvas>
  <div id="ov">
    <div class="ov-icon" id="oi">🔢</div>
    <div class="ov-title" id="ot">수동 모드!</div>
    <div class="ov-desc" id="od">
      화면의 원하는 곳을 터치하면<br>뱀이 그곳으로 자동으로 찾아가요! 🗺️<br><br>
      먹고 싶은 숫자를 터치해보세요!
    </div>
    <button class="bigbtn" onclick="startGame()">시작하기! 🎮</button>
  </div>
</div>

<div id="statusmsg">화면을 터치하면 뱀이 이동해요!</div>

<div class="btmrow">
  <button class="rbtn" onclick="startGame()">🔄 다시하기</button>
  <div class="spgrp">
    <span class="splbl">속도</span>
    <button class="spbtn on" id="sp0" onclick="setSpd(600)">🐌 느림</button>
    <button class="spbtn"    id="sp1" onclick="setSpd(340)">🐢 보통</button>
    <button class="spbtn"    id="sp2" onclick="setSpd(180)">🐇 빠름</button>
  </div>
</div>
<div class="hint">
  화면을 터치하면 뱀이 그 자리로 찾아가요<br>
  장애물(🔶)을 피해서 숫자 음식을 먹어요!
</div>

<script>
const GRID=14;
const NB=[
  null,
  {c:'#EE2222',dk:'#990000',lt:'#FFB8B8',name:'하나'},
  {c:'#FF8C00',dk:'#BB5500',lt:'#FFDDA0',name:'둘'},
  {c:'#FFD700',dk:'#AA8800',lt:'#FFF5A0',name:'셋'},
  {c:'#33BB33',dk:'#116611',lt:'#AAFFAA',name:'넷'},
  {c:'#3344EE',dk:'#1122AA',lt:'#AABBFF',name:'다섯'},
  {c:'#9922BB',dk:'#660088',lt:'#DDAAFF',name:'여섯'},
  {c:'#FF8800',dk:'#333',   lt:'#FFFFFF',name:'일곱',rainbow:true},
  {c:'#5500AA',dk:'#330066',lt:'#BB88FF',name:'여덟'},
  {c:'#888888',dk:'#444444',lt:'#CCCCCC',name:'아홉'},
  {c:'#FFFFFF',dk:'#CC0000',lt:'#FFAAAA',name:'열',numCol:'#CC0000'},
];
const RAINBOW=['#FF0000','#FF8800','#FFFF00','#00BB00','#0055FF','#8800CC','#FF0088'];
function nb(n){return NB[((n-1)%10)+1];}
function dispNum(n){return((n-1)%10)+1;}

// ── Canvas ────────────────────────────────────────────────
const gc=document.getElementById('gc');
const pc=document.getElementById('pc');
const pathc=document.getElementById('pathc');
const ctx=gc.getContext('2d');
const ptx=pc.getContext('2d');
const pctx=pathc.getContext('2d');

function resizeCanvas(){
  const W=Math.min(window.innerWidth*.96,560);
  const cell=Math.floor(W/GRID),side=cell*GRID;
  [gc,pc,pathc].forEach(c=>{
    c.width=c.height=side;
    c.style.width=c.style.height=side+'px';
  });
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
function CS(){return gc.width/GRID;}

// ── Drawing helpers ───────────────────────────────────────
function rr(cx,x,y,w,h,r){
  if(w<=0||h<=0)return;r=Math.min(r,w/2,h/2);
  cx.beginPath();
  cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}

function drawBlock(x,y,sz,b,rad,solidCol){
  if(sz<=0)return;
  if(solidCol){ctx.fillStyle=solidCol;}
  else if(b.rainbow){
    const rg=ctx.createLinearGradient(x,y,x+sz,y+sz);
    rg.addColorStop(0,'#FF0000');rg.addColorStop(0.17,'#FF8800');
    rg.addColorStop(0.33,'#FFFF00');rg.addColorStop(0.50,'#00BB00');
    rg.addColorStop(0.67,'#0055FF');rg.addColorStop(0.83,'#8800CC');
    rg.addColorStop(1,'#FF0088');ctx.fillStyle=rg;
  }else{ctx.fillStyle=b.c;}
  rr(ctx,x,y,sz,sz,rad);ctx.fill();
  if(b.c!=='#FFFFFF'&&!solidCol){
    const sh=ctx.createLinearGradient(x,y,x+sz*.7,y+sz*.7);
    sh.addColorStop(0,'rgba(255,255,255,.45)');sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sh;rr(ctx,x,y,sz,sz,rad);ctx.fill();
  }else if(solidCol){
    const sh=ctx.createLinearGradient(x,y,x+sz*.7,y+sz*.7);
    sh.addColorStop(0,'rgba(255,255,255,.38)');sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sh;rr(ctx,x,y,sz,sz,rad);ctx.fill();
  }
  if(!solidCol&&b.c!=='#FFFFFF'&&!b.rainbow&&sz*.2>0){
    ctx.fillStyle=b.dk+'99';rr(ctx,x,y+sz*.8,sz,sz*.2,Math.min(rad,sz*.1));ctx.fill();
  }
  ctx.strokeStyle=solidCol?'rgba(0,0,0,.2)':b.dk;ctx.lineWidth=b.numCol?3:2;
  rr(ctx,x,y,sz,sz,rad);ctx.stroke();
}

function drawEyes(ox,oy,C,d){
  const ew=C*.12,eh=C*.2;
  let p1,p2,w,h;
  if(d.x===1)      {p1={x:ox+C*.83,y:oy+C*.28};p2={x:ox+C*.83,y:oy+C*.64};w=ew;h=eh;}
  else if(d.x===-1){p1={x:ox+C*.17,y:oy+C*.28};p2={x:ox+C*.17,y:oy+C*.64};w=ew;h=eh;}
  else if(d.y===-1){p1={x:ox+C*.27,y:oy+C*.17};p2={x:ox+C*.66,y:oy+C*.17};w=eh;h=ew;}
  else             {p1={x:ox+C*.27,y:oy+C*.83};p2={x:ox+C*.66,y:oy+C*.83};w=eh;h=ew;}
  for(const e of[p1,p2]){
    ctx.fillStyle='white';rr(ctx,e.x-w,e.y-h,w*2,h*2,3);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1;rr(ctx,e.x-w,e.y-h,w*2,h*2,3);ctx.stroke();
    const pr=Math.min(w,h)*.65;
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.x,e.y,pr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(e.x+w*.22,e.y-h*.24,pr*.42,0,Math.PI*2);ctx.fill();
  }
}
function drawSmile(ox,oy,C,d){
  let cx,cy;
  if(d.x===1)      {cx=ox+C*.83;cy=oy+C*.84;}
  else if(d.x===-1){cx=ox+C*.17;cy=oy+C*.84;}
  else if(d.y===-1){cx=ox+C*.5; cy=oy+C*.36;}
  else             {cx=ox+C*.5; cy=oy+C*.64;}
  ctx.strokeStyle='#333';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(cx,cy,C*.09,.1*Math.PI,.9*Math.PI);ctx.stroke();
}
function drawHead(gx,gy,num,d){
  const C=CS(),b=nb(num),px=gx*C+2,py=gy*C+2,sz=C-4,dn=dispNum(num);
  ctx.shadowColor=b.c;ctx.shadowBlur=14;
  drawBlock(px,py,sz,b,10);ctx.shadowBlur=0;
  const fs=dn>=10?Math.round(C*.34):Math.round(C*.44);
  ctx.font=`bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle=b.rainbow?'#222':b.dk;ctx.lineWidth=3;
  ctx.strokeText(String(dn),gx*C+C/2,gy*C+C/2+1);
  ctx.fillStyle=b.numCol||'white';ctx.fillText(String(dn),gx*C+C/2,gy*C+C/2+1);
  drawEyes(gx*C,gy*C,C,d);drawSmile(gx*C,gy*C,C,d);
}
function drawBodySeg(gx,gy,num,idx,total){
  const C=CS(),b=nb(num),fade=Math.max(.35,1-idx/(total+4));
  const px=gx*C+4,py=gy*C+4,sz=C-8;if(sz<=0)return;
  ctx.globalAlpha=fade;
  drawBlock(px,py,sz,b,7,b.rainbow?RAINBOW[idx%RAINBOW.length]:null);
  ctx.globalAlpha=1;
}
function drawFood(gx,gy,nextNum){
  const C=CS(),b=nb(nextNum),dn=dispNum(nextNum);
  const t=Date.now()/500,pulse=1+Math.sin(t)*.09,sz=C*.70*pulse,off=(C-sz)/2;
  ctx.shadowColor=b.c;ctx.shadowBlur=20;
  drawBlock(gx*C+off,gy*C+off,sz,b,9);ctx.shadowBlur=0;
  const fs=dn>=10?Math.round(C*.28):Math.round(C*.34);
  ctx.font=`bold ${fs}px "Arial Rounded MT Bold",Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.strokeStyle=b.rainbow?'#222':b.dk;ctx.lineWidth=2.5;
  ctx.strokeText(String(dn),gx*C+C/2,gy*C+C/2);
  ctx.fillStyle=b.numCol||'white';ctx.fillText(String(dn),gx*C+C/2,gy*C+C/2);
  for(let i=0;i<5;i++){
    const a=t*1.9+i*Math.PI*2/5,r=sz*.55+6;
    ctx.globalAlpha=.6+Math.sin(t*2+i)*.4;
    ctx.fillStyle=b.rainbow?RAINBOW[i%RAINBOW.length]:b.lt;
    ctx.beginPath();ctx.arc(gx*C+C/2+Math.cos(a)*r,gy*C+C/2+Math.sin(a)*r,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawObstacle(gx,gy){
  const C=CS(),px=gx*C+1,py=gy*C+1,sz=C-2;if(sz<=0)return;
  ctx.fillStyle='#1A1A2A';rr(ctx,px,py,sz,sz,5);ctx.fill();
  ctx.save();ctx.beginPath();rr(ctx,px,py,sz,sz,5);ctx.clip();
  ctx.strokeStyle='rgba(255,70,0,.22)';ctx.lineWidth=5;
  for(let i=-sz;i<sz*2;i+=9){ctx.beginPath();ctx.moveTo(px+i,py);ctx.lineTo(px+i+sz,py+sz);ctx.stroke();}
  ctx.restore();
  ctx.strokeStyle='#FF4400';ctx.lineWidth=2;rr(ctx,px,py,sz,sz,5);ctx.stroke();
  const m=Math.max(6,sz*.22);
  ctx.strokeStyle='#FF6633';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(px+m,py+m);ctx.lineTo(px+sz-m,py+sz-m);
  ctx.moveTo(px+sz-m,py+m);ctx.lineTo(px+m,py+sz-m);ctx.stroke();
}

// ── Path overlay drawing ──────────────────────────────────
function drawNavOverlay(){
  pctx.clearRect(0,0,pathc.width,pathc.height);
  const C=CS();
  // Idle pulse on head when waiting
  if(running&&!target){
    const t=Date.now()/700;
    const a=.25+Math.sin(t)*.15;
    pctx.globalAlpha=a;
    pctx.strokeStyle='#22C55E';
    pctx.lineWidth=3;
    pctx.setLineDash([5,5]);
    rr(pctx,snake[0].x*C+1,snake[0].y*C+1,C-2,C-2,8);
    pctx.stroke();
    pctx.setLineDash([]);
    pctx.globalAlpha=1;
    return;
  }
  if(!target)return;
  // Path dots
  if(navPath&&navPath.length>0){
    for(let i=0;i<navPath.length;i++){
      const p=navPath[i];
      const a=Math.max(.15,.65-i/navPath.length*.5);
      pctx.globalAlpha=a;
      pctx.fillStyle='#22C55E';
      pctx.beginPath();
      pctx.arc(p.x*C+C/2,p.y*C+C/2,Math.max(2,C*.1),0,Math.PI*2);
      pctx.fill();
    }
    pctx.globalAlpha=1;
  }
  // Target highlight (pulsing dashed box)
  const t=Date.now()/600;
  const a=.5+Math.sin(t)*.3;
  pctx.globalAlpha=a;
  pctx.strokeStyle='#22C55E';
  pctx.lineWidth=2.5;
  pctx.setLineDash([5,4]);
  rr(pctx,target.x*C+2,target.y*C+2,C-4,C-4,6);
  pctx.stroke();
  pctx.setLineDash([]);
  pctx.globalAlpha=1;
  // "No path" indicator
  if(noPath){
    pctx.globalAlpha=.7;
    pctx.fillStyle='#EF4444';
    pctx.font=`bold ${Math.round(C*.5)}px Arial`;
    pctx.textAlign='center';pctx.textBaseline='middle';
    pctx.fillText('✕',target.x*C+C/2,target.y*C+C/2);
    pctx.globalAlpha=1;
  }
}

// ── Particles ─────────────────────────────────────────────
let parts=[];
function burst(cx,cy,col,lt){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,v=1.5+Math.random()*5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,life:1,
               sz:3+Math.random()*5,col:Math.random()>.45?col:lt});
  }
}
function burstRainbow(cx,cy){
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2,v=2+Math.random()*5;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,
               life:1,sz:3+Math.random()*5,col:RAINBOW[i%7]});
  }
}
function tickParts(){
  ptx.clearRect(0,0,pc.width,pc.height);
  parts=parts.filter(p=>p.life>.01);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.028;
    ptx.globalAlpha=Math.max(0,p.life*p.life);
    ptx.fillStyle=p.col;ptx.beginPath();ptx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ptx.fill();
  }
  ptx.globalAlpha=1;
}

// ── Audio ─────────────────────────────────────────────────
let actx=null;
function getAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
const NOTES=[262,294,330,349,392,440,494,523,587,659];
function sfxEat(n){try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='triangle';const f=NOTES[(n-1)%10];o.frequency.setValueAtTime(f,a.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,a.currentTime+.12);g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.28);o.start(a.currentTime);o.stop(a.currentTime+.3);}catch(e){}}
function sfxDie(){try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sawtooth';o.frequency.setValueAtTime(260,a.currentTime);o.frequency.exponentialRampToValueAtTime(50,a.currentTime+.6);g.gain.setValueAtTime(.22,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start(a.currentTime);o.stop(a.currentTime+.65);}catch(e){}}
function sfxNav(){try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(600,a.currentTime);o.frequency.exponentialRampToValueAtTime(900,a.currentTime+.08);g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start(a.currentTime);o.stop(a.currentTime+.13);}catch(e){}}

// ── Game state ────────────────────────────────────────────
let snake=[],dir={x:1,y:0};
let food=null,score=0,best=0,running=false,speed=600;
let obstacles=[];
let target=null,navPath=null,noPath=false;

// ── Placement ─────────────────────────────────────────────
function occupied(){
  const s=new Set(snake.map(p=>p.x+','+p.y));
  obstacles.forEach(o=>s.add(o.x+','+o.y));
  return s;
}
function randomPos(occ){
  let p,t=0;
  do{p={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};t++;}
  while(occ.has(p.x+','+p.y)&&t<500);
  return occ.has(p.x+','+p.y)?null:p;
}
function randomFood(){const occ=occupied();if(food)occ.add(food.x+','+food.y);return randomPos(occ)||{x:0,y:0};}
function addObstacle(){const occ=occupied();if(food)occ.add(food.x+','+food.y);const p=randomPos(occ);if(p)obstacles.push(p);}

function updateLabel(){
  const n=snake.length,b=nb(n),dn=dispNum(n),lbl=document.getElementById('nblabel');
  lbl.textContent=`넘버블럭 ${dn} (${b.name})이에요!`;
  const col=b.rainbow?'#FF8800':(b.numCol||b.c);
  lbl.style.color=col;lbl.style.borderColor=col;lbl.style.background=col+'14';
}
function setStatus(msg){document.getElementById('statusmsg').textContent=msg;}

// ── BFS Pathfinding ───────────────────────────────────────
function findPath(from,to){
  if(from.x===to.x&&from.y===to.y)return[];
  // Blocked: all snake segments except tail (tail moves away)
  const blocked=new Set();
  for(let i=0;i<snake.length-1;i++)blocked.add(snake[i].x+','+snake[i].y);
  obstacles.forEach(o=>blocked.add(o.x+','+o.y));

  const startKey=from.x+','+from.y;
  const goalKey=to.x+','+to.y;
  const parent=new Map([[startKey,null]]);
  const posMap=new Map([[startKey,from]]);
  const queue=[from];
  const dirs4=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

  while(queue.length>0){
    const curr=queue.shift();
    const currKey=curr.x+','+curr.y;
    if(currKey===goalKey){
      // Reconstruct path (excludes start, includes goal)
      const path=[];
      let c=currKey;
      while(parent.get(c)!==null){
        path.unshift(posMap.get(c));
        c=parent.get(c);
      }
      return path;
    }
    for(const d of dirs4){
      const nx=(curr.x+d.x+GRID)%GRID,ny=(curr.y+d.y+GRID)%GRID;
      const key=nx+','+ny;
      if(!parent.has(key)&&!blocked.has(key)){
        parent.set(key,currKey);
        posMap.set(key,{x:nx,y:ny});
        queue.push({x:nx,y:ny});
      }
    }
  }
  return null; // no path
}

// ── Game tick (only moves if there's an active path) ──────
function gameTick(){
  if(!target)return; // waiting for player input

  // Reached target?
  if(snake[0].x===target.x&&snake[0].y===target.y){
    target=null;navPath=null;noPath=false;
    setStatus('목적지에 도착했어요! 다음 곳을 터치하세요 👆');
    return;
  }

  // Validate / recalculate path
  if(!navPath||navPath.length===0){
    navPath=findPath(snake[0],target);
    if(!navPath){noPath=true;target=null;setStatus('길을 찾을 수 없어요! 다른 곳을 터치하세요');return;}
    noPath=false;
  }

  // Check next step is still clear
  const nextStep=navPath[0];
  const nextKey=nextStep.x+','+nextStep.y;
  const isBlocked=
    snake.slice(0,snake.length-1).some(s=>s.x+','+s.y===nextKey)||
    obstacles.some(o=>o.x+','+o.y===nextKey);
  if(isBlocked){
    navPath=findPath(snake[0],target);
    if(!navPath){noPath=true;target=null;setStatus('길이 막혔어요! 다른 곳을 터치하세요');return;}
    return; // wait for next tick with new path
  }
  navPath.shift();

  // Obstacle collision
  if(obstacles.some(o=>o.x===nextStep.x&&o.y===nextStep.y)){endGame();return;}

  const hx=nextStep.x,hy=nextStep.y;

  // Update visual direction
  let dx=hx-snake[0].x,dy=hy-snake[0].y;
  if(dx>GRID/2)dx-=GRID;if(dx<-GRID/2)dx+=GRID;
  if(dy>GRID/2)dy-=GRID;if(dy<-GRID/2)dy+=GRID;
  if(dx!==0||dy!==0)dir={x:dx,y:dy};

  const eating=(food!==null&&hx===food.x&&hy===food.y);
  snake.unshift({x:hx,y:hy});if(!eating)snake.pop();

  if(eating){
    score++;best=Math.max(best,score);
    document.getElementById('sv').textContent=score;
    document.getElementById('bv').textContent=best;
    updateLabel();food=randomFood();
    const C=CS(),b=nb(snake.length);
    if(b.rainbow)burstRainbow(hx*C+C/2,hy*C+C/2);else burst(hx*C+C/2,hy*C+C/2,b.c,b.lt);
    sfxEat(snake.length);
    if(score>0&&score%3===0&&obstacles.length<8)addObstacle();
    if(target&&target.x===hx&&target.y===hy){target=null;navPath=null;}
    if(target)navPath=findPath(snake[0],target); // recalc after body change
    setStatus(`${dispNum(snake.length-1)}을 먹었어요! 🎉 다음 곳을 터치하세요`);
  }
}

// ── Render ────────────────────────────────────────────────
function draw(){
  const s=gc.width;
  const g=ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#f0fff4');g.addColorStop(1,'#fffff0');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  const C=CS();
  ctx.strokeStyle='rgba(0,100,50,0.06)';ctx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(s,i*C);ctx.stroke();
  }
  for(const obs of obstacles)drawObstacle(obs.x,obs.y);
  for(let i=snake.length-1;i>=1;i--)drawBodySeg(snake[i].x,snake[i].y,snake.length,i,snake.length);
  if(snake.length>0)drawHead(snake[0].x,snake[0].y,snake.length,dir);
  if(food)drawFood(food.x,food.y,snake.length+1);
  tickParts();
}

// ── RAF loop ──────────────────────────────────────────────
let rafId=null,prevTs=0,lag=0;
function frame(ts){
  if(prevTs!==0){
    const dt=Math.min(ts-prevTs,250);
    if(running){lag+=dt;while(lag>=speed){lag-=speed;gameTick();if(!running){lag=0;break;}}}
  }
  prevTs=ts;
  try{draw();}catch(e){console.error(e);}
  drawNavOverlay();
  rafId=requestAnimationFrame(frame);
}
function startLoop(){if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}prevTs=0;lag=0;rafId=requestAnimationFrame(frame);}

// ── Game over ─────────────────────────────────────────────
function endGame(){
  running=false;lag=0;target=null;navPath=null;sfxDie();
  const n=snake.length,b=nb(n),dn=dispNum(n);
  document.getElementById('oi').textContent='😢';
  document.getElementById('ot').style.color='#FF5555';
  document.getElementById('ot').textContent='게임 오버!';
  document.getElementById('od').innerHTML=
    `넘버블럭 <b style="color:${b.c==='#FFFFFF'?'#CC0000':b.c}">${dn}</b>까지 키웠어요!<br>`+
    `점수: <b style="color:#FFD700">${score}점</b>`;
  setTimeout(()=>{document.getElementById('ov').classList.remove('hidden');},150);
}

// ── Start game ────────────────────────────────────────────
function startGame(){
  try{getAudio();}catch(e){}
  running=false;
  snake=[{x:GRID>>1,y:GRID>>1}];dir={x:1,y:0};
  score=0;parts=[];obstacles=[];food=randomFood();
  target=null;navPath=null;noPath=false;
  document.getElementById('sv').textContent=0;
  document.getElementById('oi').textContent='🔢';
  document.getElementById('ot').style.color='#FFD700';
  document.getElementById('ot').textContent='수동 모드!';
  document.getElementById('od').innerHTML=
    '화면의 원하는 곳을 터치하면<br>뱀이 그곳으로 자동으로 찾아가요! 🗺️<br><br>먹고 싶은 숫자를 터치해보세요!';
  document.getElementById('ov').classList.add('hidden');
  updateLabel();
  setStatus('화면을 터치해서 뱀을 움직여보세요! 👆');
  running=true;startLoop();
}

// ── Speed control ─────────────────────────────────────────
const SPDMAP={600:'sp0',340:'sp1',180:'sp2'};
function setSpd(ms){
  speed=ms;lag=0;
  document.querySelectorAll('.spbtn').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById(SPDMAP[ms]);if(el)el.classList.add('on');
}

// ── Canvas tap/click handler ──────────────────────────────
function handleTap(clientX,clientY){
  if(!running)return;
  const rect=gc.getBoundingClientRect();
  const scaleX=gc.width/rect.width,scaleY=gc.height/rect.height;
  const px=(clientX-rect.left)*scaleX,py=(clientY-rect.top)*scaleY;
  const C=CS();
  const gx=Math.floor(px/C),gy=Math.floor(py/C);
  if(gx<0||gx>=GRID||gy<0||gy>=GRID)return;
  if(gx===snake[0].x&&gy===snake[0].y)return; // tapped own head
  // Ignore tapping on obstacles
  if(obstacles.some(o=>o.x===gx&&o.y===gy)){
    setStatus('장애물이에요! 다른 곳을 터치하세요 ⚠️');return;
  }
  target={x:gx,y:gy};
  navPath=findPath(snake[0],target);
  noPath=false;
  if(!navPath){
    noPath=true;target=null;
    setStatus('길을 찾을 수 없어요! 다른 곳을 터치하세요');
    return;
  }
  sfxNav();
  // Tell user if they tapped the food
  const isFoodTarget=food&&gx===food.x&&gy===food.y;
  if(isFoodTarget){
    setStatus(`${dispNum(snake.length+1)} 먹으러 가요! 🍎`);
  }else{
    setStatus('길을 찾았어요! 이동 중... 🐍');
  }
}

gc.addEventListener('click',e=>handleTap(e.clientX,e.clientY));
gc.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  handleTap(t.clientX,t.clientY);
},{passive:false});

draw();
</script>
